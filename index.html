<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="color-scheme" content="light">
<meta name="supported-color-schemes" content="light">
<meta name="theme-color" content="#f7f3ea">
<title>Form Timbangan</title>
<style>
  html { color-scheme: light only; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #f7f3ea;
    color: #2b2620;
    padding-bottom: 104px;
    -webkit-font-smoothing: antialiased;
  }
  header {
    padding: 22px 18px 16px;
    background: #fbf8f0;
    border-bottom: 2px solid #2b2620;
    position: sticky;
    top: 0;
    z-index: 10;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
  }
  header h1 {
    margin: 0;
    font-family: Georgia, "Times New Roman", serif;
    font-weight: 400;
    font-size: 23px;
    letter-spacing: 0.2px;
    color: #2b2620;
  }
  header .eyebrow {
    display: block;
    font-family: -apple-system, sans-serif;
    font-size: 9.5px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #8a7f6b;
    margin-top: 3px;
    font-weight: 700;
  }
  .hist-btn {
    background: transparent;
    border: 1px solid #2b2620;
    color: #2b2620;
    padding: 9px 16px;
    font-size: 11.5px;
    font-weight: 700;
    letter-spacing: 0.6px;
  }
  .topbar {
    padding: 16px 18px 0;
  }
  .datebar {
    display: flex;
    gap: 8px;
    margin-bottom: 14px;
  }
  .datebar input {
    flex: 1;
    background: #fff;
    border: 1px solid #d8cfba;
    color: #2b2620;
    padding: 13px 14px;
    font-size: 14px;
    font-family: Georgia, serif;
  }
  .datebar input::placeholder { color: #a89b7f; font-style: italic; }
  .cust-label {
    font-size: 10px;
    font-weight: 700;
    color: #8a7f6b;
    margin-bottom: 8px;
    text-transform: uppercase;
    letter-spacing: 2px;
  }
  .cust-row {
    display: flex;
    gap: 8px;
    margin-bottom: 8px;
  }
  .cust-btn {
    flex: 1;
    padding: 12px 8px;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.6px;
    border: 1px solid #d8cfba;
    background: transparent;
    color: #6b5f4a;
  }
  .cust-btn.active-BESAR { background: #2b2620; color: #f7f3ea; border-color: #2b2620; }
  .cust-btn.active-HIJAU { background: #5b6b4f; color: #f7f3ea; border-color: #5b6b4f; }
  .cust-btn.active-MERAH { background: #8b3a3a; color: #f7f3ea; border-color: #8b3a3a; }
  .container {
    padding: 18px;
  }
  .cat {
    background: #fff;
    border: 1px solid #e5ddc9;
    margin-bottom: 10px;
    overflow: hidden;
  }
  .cat-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 13px 15px;
    cursor: pointer;
  }
  .cat-head .left {
    display: flex;
    align-items: center;
    gap: 11px;
  }
  .badge {
    min-width: 36px;
    height: 30px;
    padding: 0 9px;
    border-radius: 7px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 11px;
    font-family: Georgia, serif;
    letter-spacing: 0.3px;
    white-space: nowrap;
  }
  .cat-total { font-size: 14px; font-weight: 700; color: #8b3a3a; font-family: Georgia, serif; }
  .cat-name {
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 15px;
    font-weight: 400;
    color: #2b2620;
    font-family: Georgia, serif;
  }
  .utuh-tag {
    font-size: 8.5px;
    font-weight: 700;
    background: #f2ede0;
    color: #8a7f6b;
    padding: 3px 6px;
    letter-spacing: 0.8px;
    border: 1px solid #d8cfba;
    font-family: -apple-system, sans-serif;
  }
  .cat-body {
    display: none;
    padding: 0 15px 15px;
  }
  .cat-body.open { display: block; }
  .entry-row {
    display: flex;
    gap: 8px;
    margin-bottom: 8px;
  }
  .entry-row input {
    flex: 1;
    background: #fbf8f0;
    border: 1px solid #e5ddc9;
    color: #2b2620;
    padding: 11px 12px;
    font-size: 16px;
    font-family: Georgia, serif;
  }
  .entry-row button {
    background: #fff;
    border: 1px solid #d8cfba;
    color: #8b3a3a;
    width: 42px;
    font-size: 15px;
  }
  .add-btn {
    width: 100%;
    padding: 11px;
    background: transparent;
    border: 1px dashed #c9b98f;
    color: #6b5f4a;
    font-size: 12.5px;
    font-weight: 700;
    letter-spacing: 0.4px;
    margin-top: 4px;
  }
  .grand {
    background: #2b2620;
    padding: 20px;
    margin-top: 10px;
  }
  .grand h3 {
    margin: 0 0 12px;
    font-size: 10px;
    color: #a89b7f;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 2px;
  }
  .grand-row {
    display: flex;
    justify-content: space-between;
    font-size: 14px;
    color: #d8cfba;
    padding: 7px 0;
    border-bottom: 1px solid #3d372c;
    font-family: Georgia, serif;
  }
  .grand-row.total {
    border-bottom: none;
    margin-top: 8px;
    padding-top: 14px;
    border-top: 1px solid #4a4436;
    font-size: 19px;
    font-weight: 400;
    color: #f7f3ea;
  }
  .grand-row.total span:last-child { color: #d4af6a; }
  .footer-bar {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: #fbf8f0;
    border-top: 2px solid #2b2620;
    padding: 12px 18px calc(12px + env(safe-area-inset-bottom));
    display: flex;
    gap: 10px;
  }
  .footer-bar button {
    flex: 1;
    padding: 15px;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.5px;
    border: 1px solid #2b2620;
  }
  .btn-save { background: transparent; color: #2b2620; flex: 0 0 92px; }
  .btn-finish { background: #2b2620; color: #f7f3ea; }
  .btn-reset { background: transparent; color: #8a7f6b; border-color: #d8cfba; flex: 0 0 76px; }
  .chev { transition: transform 0.2s; color: #c9b98f; }
  .chev.open { transform: rotate(180deg); }

  .overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(43,38,32,0.55);
    z-index: 50;
    align-items: flex-end;
  }
  .overlay.open { display: flex; }
  .sheet {
    background: #f7f3ea;
    width: 100%;
    max-height: 85vh;
    border-top: 2px solid #2b2620;
    padding: 20px;
    overflow-y: auto;
  }
  .sheet-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
  }
  .sheet-head h3 { margin: 0; font-size: 19px; font-weight: 400; color: #2b2620; font-family: Georgia, serif; }
  .close-btn {
    background: transparent;
    border: 1px solid #2b2620;
    color: #2b2620;
    width: 32px; height: 32px;
    font-size: 13px;
  }
  .hist-toolbar {
    display: flex;
    gap: 8px;
    margin-bottom: 14px;
  }
  .hist-toolbar button {
    flex: 1;
    padding: 10px;
    font-size: 11.5px;
    font-weight: 700;
    letter-spacing: 0.4px;
    border: 1px solid #d8cfba;
    background: #fff;
    color: #6b5f4a;
  }
  .hist-toolbar button.danger { color: #8b3a3a; border-color: #d8b4a8; background: #fdf3f0; }
  .hist-toolbar button.active { background: #2b2620; color: #f7f3ea; border-color: #2b2620; }
  .hist-item {
    background: #fff;
    border: 1px solid #e5ddc9;
    padding: 13px 14px;
    margin-bottom: 8px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .hist-item .d { font-size: 14px; font-weight: 700; color: #2b2620; font-family: Georgia, serif; }
  .hist-item .t { font-size: 11.5px; color: #8a7f6b; margin-top: 2px; }
  .hist-item button.open-btn {
    background: #2b2620;
    color: #f7f3ea;
    border: none;
    padding: 9px 14px;
    font-size: 12px;
    font-weight: 700;
  }
  .hist-checkbox {
    width: 21px;
    height: 21px;
    border: 1.5px solid #c9b98f;
    margin-right: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    font-size: 12px;
    color: #fff;
    font-weight: 900;
  }
  .hist-checkbox.checked { background: #2b2620; border-color: #2b2620; }
  .empty-hist { color: #a89b7f; font-size: 13px; text-align: center; padding: 30px 0; font-family: Georgia, serif; font-style: italic; }
  .toast {
    position: fixed;
    bottom: 92px;
    left: 50%;
    transform: translateX(-50%);
    background: #2b2620;
    color: #f7f3ea;
    padding: 11px 20px;
    font-size: 12.5px;
    font-weight: 700;
    opacity: 0;
    transition: opacity 0.25s;
    z-index: 60;
    pointer-events: none;
  }
  .toast.show { opacity: 1; }

  .summary-box {
    background: #fff;
    border: 1px solid #e5ddc9;
    padding: 16px;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 13px;
    line-height: 1.7;
    white-space: pre-wrap;
    word-break: break-word;
    color: #2b2620;
    margin-bottom: 16px;
  }
  .sheet-actions {
    display: flex;
    gap: 10px;
  }
  .sheet-actions button {
    flex: 1;
    padding: 15px;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.5px;
    border: 1px solid #2b2620;
  }
  .btn-copy { background: #2b2620; color: #f7f3ea; }
  .btn-close2 { background: transparent; color: #2b2620; }
</style>
</head>
<body>

<header>
  <div>
    <h1>Form Timbangan</h1>
    <span class="eyebrow">Daily Weighing Record</span>
  </div>
  <button class="hist-btn" id="histBtn">Riwayat</button>
</header>

<div class="topbar">
  <div class="datebar">
    <input type="text" id="dateInput" placeholder="Tanggal (contoh: Kamis, 6 Agu 2026)">
  </div>
  <div class="cust-label">Customer</div>
  <div class="cust-row" id="custRow"></div>
</div>

<div class="container" id="catContainer"></div>

<div class="footer-bar">
  <button class="btn-reset" id="resetBtn">Reset</button>
  <button class="btn-save" id="saveBtn">Simpan</button>
  <button class="btn-finish" id="finishBtn">Finish</button>
</div>

<div class="overlay" id="histOverlay">
  <div class="sheet">
    <div class="sheet-head">
      <h3>Riwayat Tersimpan</h3>
      <button class="close-btn" id="closeHist">✕</button>
    </div>
    <div class="hist-toolbar">
      <button id="selectModeBtn">Select</button>
      <button class="danger" id="clearHistBtn">Clear Histories</button>
    </div>
    <div id="histList"><div class="empty-hist">Memuat...</div></div>
  </div>
</div>

<div class="overlay" id="finishOverlay">
  <div class="sheet">
    <div class="sheet-head">
      <h3>Ringkasan</h3>
      <button class="close-btn" id="closeFinish">✕</button>
    </div>
    <div class="summary-box" id="summaryBox"></div>
    <div class="sheet-actions">
      <button class="btn-close2" id="closeFinish2">Tutup</button>
      <button class="btn-copy" id="copyBtn">Copy</button>
    </div>
  </div>
</div>

<div class="overlay" id="modalOverlay">
  <div class="sheet" style="max-height:none;">
    <div id="modalMsg" style="font-size:15px;line-height:1.5;margin-bottom:18px;color:#2b2620;font-family:Georgia,serif;"></div>
    <div class="sheet-actions" id="modalActions"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const CATEGORIES = [
  { code: 'R',        short: 'R',   color: '#8b3a3a', unit: 'kg' },
  { code: 'R (UTUH)', short: 'R',   color: '#8b3a3a', unit: 'kg' },
  { code: 'O',        short: 'O',   color: '#a3654f', unit: 'kg' },
  { code: 'O (UTUH)', short: 'O',   color: '#a3654f', unit: 'kg' },
  { code: 'B',        short: 'B',   color: '#b08c4f', unit: 'kg' },
  { code: 'K',        short: 'K',   color: '#8a7f4f', unit: 'kg' },
  { code: 'US',       short: 'US',  color: '#5b6b4f', unit: 'kg' },
  { code: 'US (UTUH)', short: 'US', color: '#5b6b4f', unit: 'kg' },
  { code: 'SIR',      short: 'SIR', color: '#5b8a7a', unit: 'kg' },
  { code: 'SIR (UTUH)', short: 'SIR', color: '#5b8a7a', unit: 'kg' },
  { code: 'L',        short: 'L',   color: '#5b6b7a', unit: 'kg' },
  { code: 'Tonggue',   short: 'TG',  color: '#5b6b7a', unit: 'kg' },
  { code: 'GFPrime',  short: 'GFP', color: '#7a5b6b', unit: 'kg' },
  { code: 'GFPrem',   short: 'GFM', color: '#7a5b6b', unit: 'kg' },
  { code: 'Bone Marrow', short: 'BM', color: '#b08c4f', unit: 'kg' },
  { code: 'Bone',     short: 'BN',  color: '#8b3a3a', unit: 'g' },
];

const CUSTOMERS = ['BESAR', 'HIJAU', 'MERAH'];

const state = {};
CATEGORIES.forEach(c => state[c.code] = ['']);
let selectedCustomer = null;
const openState = {};

// In-memory history for this session. There is no reliable device-level
// storage available in this environment, so data lives only in the
// browser tab's memory while the page stays open.
// History is persisted in localStorage so it survives closing the tab/app —
// it stays until the user deletes it via Select or Clear Histories.
const HISTORY_KEY = 'timbangan_history_v1';

function loadHistoryFromStorage() {
  try {
    const raw = localStorage.getItem(HISTORY_KEY);
    return raw ? JSON.parse(raw) : [];
  } catch (e) {
    console.error('Failed to load history from storage:', e);
    return [];
  }
}

function saveHistoryToStorage() {
  try {
    localStorage.setItem(HISTORY_KEY, JSON.stringify(localHistory));
  } catch (e) {
    console.error('Failed to save history to storage:', e);
  }
}

const localHistory = loadHistoryFromStorage();
let selectMode = false;
const selectedKeys = new Set();

const container = document.getElementById('catContainer');
const toastEl = document.getElementById('toast');

function parseNum(v) {
  if (typeof v !== 'string') return NaN;
  const cleaned = v.replace(',', '.').trim();
  return parseFloat(cleaned);
}

function catSum(code) {
  return state[code].map(parseNum).filter(v => !isNaN(v)).reduce((a,b) => a+b, 0);
}

function cssId(code) {
  return code.replace(/[^a-zA-Z0-9]+/g, '_');
}

function baseCode(code) {
  return code.replace(/\s*\(UTUH\)$/i, '');
}

function isUtuh(code) {
  return /\(UTUH\)$/i.test(code);
}

function tint(hex, alpha) {
  const r = parseInt(hex.slice(1,3), 16);
  const g = parseInt(hex.slice(3,5), 16);
  const b = parseInt(hex.slice(5,7), 16);
  return `rgba(${r},${g},${b},${alpha})`;
}

// ---- Customer selector ----
function renderCustomers() {
  const row = document.getElementById('custRow');
  row.innerHTML = '';
  CUSTOMERS.forEach(name => {
    const btn = document.createElement('button');
    btn.className = 'cust-btn' + (selectedCustomer === name ? ' active-' + name : '');
    btn.type = 'button';
    btn.textContent = name;
    btn.onclick = () => {
      selectedCustomer = (selectedCustomer === name) ? null : name;
      renderCustomers();
    };
    row.appendChild(btn);
  });
}

// Full render: rebuilds structure (rows added/removed, toggle open/close)
function render() {
  container.innerHTML = '';
  CATEGORIES.forEach(cat => {
    const sum = catSum(cat.code);

    const catDiv = document.createElement('div');
    catDiv.className = 'cat';

    const head = document.createElement('div');
    head.className = 'cat-head';
    head.innerHTML = `
      <div class="left">
        <div class="badge" style="background:${tint(cat.color, 0.14)};color:${cat.color};border:1px solid ${tint(cat.color, 0.4)};">${cat.short}</div>
        <div class="cat-name">${baseCode(cat.code)}${isUtuh(cat.code) ? '<span class="utuh-tag">UTUH</span>' : ''}</div>
      </div>
      <div style="display:flex;align-items:center;gap:10px;">
        <div class="cat-total" id="total-${cssId(cat.code)}">${sum > 0 ? sum.toFixed(2) + ' ' + cat.unit : '—'}</div>
        <div class="chev ${openState[cat.code] ? 'open' : ''}">▾</div>
      </div>
    `;
    head.onclick = () => { openState[cat.code] = !openState[cat.code]; render(); };

    const body = document.createElement('div');
    body.className = 'cat-body' + (openState[cat.code] ? ' open' : '');

    state[cat.code].forEach((val, idx) => {
      const row = document.createElement('div');
      row.className = 'entry-row';
      const input = document.createElement('input');
      input.type = 'text';
      input.inputMode = 'decimal';
      input.placeholder = 'Berat ' + cat.unit;
      input.value = val;
      // Lightweight update: only touch state + totals, never re-render the whole DOM
      input.oninput = (e) => {
        state[cat.code][idx] = e.target.value;
        refreshTotalsOnly();
      };
      const delBtn = document.createElement('button');
      delBtn.type = 'button';
      delBtn.textContent = '✕';
      delBtn.onclick = () => {
        state[cat.code].splice(idx, 1);
        if (state[cat.code].length === 0) state[cat.code].push('');
        render();
      };
      row.appendChild(input);
      row.appendChild(delBtn);
      body.appendChild(row);
    });

    const addBtn = document.createElement('button');
    addBtn.className = 'add-btn';
    addBtn.type = 'button';
    addBtn.textContent = '+ Tambah angka';
    addBtn.onclick = () => {
      state[cat.code].push('');
      openState[cat.code] = true;
      render();
      const inputs = document.querySelectorAll(`#body-${cssId(cat.code)} input`);
      if (inputs.length) inputs[inputs.length - 1].focus();
    };
    body.id = 'body-' + cssId(cat.code);
    body.appendChild(addBtn);

    catDiv.appendChild(head);
    catDiv.appendChild(body);
    container.appendChild(catDiv);
  });

  renderGrandTotal();
}

// Lightweight update: does NOT touch input elements, so focus/cursor is preserved
function refreshTotalsOnly() {
  CATEGORIES.forEach(cat => {
    const sum = catSum(cat.code);
    const el = document.getElementById('total-' + cssId(cat.code));
    if (el) el.textContent = sum > 0 ? sum.toFixed(2) + ' ' + cat.unit : '—';
  });
  renderGrandTotal();
}

function renderGrandTotal() {
  let old = document.getElementById('grandBox');
  if (old) old.remove();

  const grand = document.createElement('div');
  grand.className = 'grand';
  grand.id = 'grandBox';
  grand.innerHTML = `<h3>Total Keseluruhan</h3>`;

  let totalKg = 0;
  CATEGORIES.forEach(cat => {
    if (cat.unit !== 'kg') return;
    const sum = catSum(cat.code);
    if (sum > 0) {
      totalKg += sum;
      const row = document.createElement('div');
      row.className = 'grand-row';
      row.innerHTML = `<span>${cat.code}</span><span>${sum.toFixed(2)} kg</span>`;
      grand.appendChild(row);
    }
  });

  const totalRow = document.createElement('div');
  totalRow.className = 'grand-row total';
  totalRow.innerHTML = `<span>Total (kg)</span><span>${totalKg.toFixed(2)} kg</span>`;
  grand.appendChild(totalRow);

  const boneSum = catSum('Bone');
  if (boneSum > 0) {
    const boneRow = document.createElement('div');
    boneRow.className = 'grand-row';
    boneRow.innerHTML = `<span>Bone (terpisah)</span><span>${boneSum.toFixed(2)} g</span>`;
    grand.appendChild(boneRow);
  }

  container.appendChild(grand);
}

document.getElementById('resetBtn').onclick = async () => {
  const ok = await customConfirm('Reset semua data?');
  if (!ok) return;
  CATEGORIES.forEach(c => state[c.code] = ['']);
  Object.keys(openState).forEach(k => openState[k] = false);
  selectedCustomer = null;
  render();
  renderCustomers();
};

function showToast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  setTimeout(() => toastEl.classList.remove('show'), 1600);
}

// Self-contained modal replacements for alert()/confirm(). Native browser
// dialogs can be silently blocked inside sandboxed iframes (which this
// artifact runs in), so we never rely on them for anything the flow depends on.
function customAlert(message) {
  return new Promise(resolve => {
    const overlay = document.getElementById('modalOverlay');
    document.getElementById('modalMsg').textContent = message;
    const actions = document.getElementById('modalActions');
    actions.innerHTML = '';
    const okBtn = document.createElement('button');
    okBtn.className = 'btn-copy';
    okBtn.textContent = 'OK';
    okBtn.onclick = () => {
      overlay.classList.remove('open');
      resolve();
    };
    actions.appendChild(okBtn);
    overlay.classList.add('open');
  });
}

function customConfirm(message) {
  return new Promise(resolve => {
    const overlay = document.getElementById('modalOverlay');
    document.getElementById('modalMsg').textContent = message;
    const actions = document.getElementById('modalActions');
    actions.innerHTML = '';
    const cancelBtn = document.createElement('button');
    cancelBtn.className = 'btn-close2';
    cancelBtn.textContent = 'Batal';
    cancelBtn.onclick = () => { overlay.classList.remove('open'); resolve(false); };
    const okBtn = document.createElement('button');
    okBtn.className = 'btn-copy';
    okBtn.textContent = 'Ya';
    okBtn.onclick = () => { overlay.classList.remove('open'); resolve(true); };
    actions.appendChild(cancelBtn);
    actions.appendChild(okBtn);
    overlay.classList.add('open');
  });
}

// ---- Save / History ----
// SIMPAN stores the current entry in this session's memory (so it can be
// resumed later via Riwayat), then clears the form for a new sale.
// NOTE: this is in-browser memory only — it does NOT persist if the page
// is closed/refreshed. There is no reliable device-level storage available
// in this environment, so we keep it simple and dependency-free.
document.getElementById('saveBtn').onclick = async () => {
  const dateStr = document.getElementById('dateInput').value.trim();
  if (!dateStr) { await customAlert('Isi tanggal dulu sebelum simpan.'); return; }

  const hasData = CATEGORIES.some(cat => catSum(cat.code) > 0);
  if (!hasData) { await customAlert('Belum ada berat yang diisi.'); return; }

  const key = 'timbangan-' + Date.now();
  const payload = { key, date: dateStr, customer: selectedCustomer, state: JSON.parse(JSON.stringify(state)), savedAt: new Date().toISOString() };
  localHistory.unshift(payload);
  saveHistoryToStorage();

  // Clear the form for a new sale — the saved entry stays accessible under Riwayat
  CATEGORIES.forEach(c => state[c.code] = ['']);
  Object.keys(openState).forEach(k => openState[k] = false);
  selectedCustomer = null;
  document.getElementById('dateInput').value = '';
  render();
  renderCustomers();
  showToast('Tersimpan ✓ — form dikosongkan, siap transaksi baru');
};

document.getElementById('histBtn').onclick = () => {
  document.getElementById('histOverlay').classList.add('open');
  selectMode = false;
  selectedKeys.clear();
  loadHistoryList();
};
document.getElementById('closeHist').onclick = () => {
  document.getElementById('histOverlay').classList.remove('open');
};
document.getElementById('histOverlay').onclick = (e) => {
  if (e.target.id === 'histOverlay') e.currentTarget.classList.remove('open');
};

document.getElementById('selectModeBtn').onclick = () => {
  if (selectMode) {
    if (selectedKeys.size > 0) {
      deleteSelected();
    } else {
      selectMode = false;
      loadHistoryList();
    }
  } else {
    selectMode = true;
    selectedKeys.clear();
    loadHistoryList();
  }
};

async function deleteSelected() {
  const ok = await customConfirm(`Hapus ${selectedKeys.size} riwayat terpilih?`);
  if (!ok) return;
  for (const key of selectedKeys) {
    const idx = localHistory.findIndex(h => h.key === key);
    if (idx !== -1) localHistory.splice(idx, 1);
  }
  saveHistoryToStorage();
  selectedKeys.clear();
  selectMode = false;
  loadHistoryList();
}

document.getElementById('clearHistBtn').onclick = async () => {
  if (localHistory.length === 0) { await customAlert('Riwayat sudah kosong.'); return; }
  const ok = await customConfirm('Hapus SEMUA riwayat? Tindakan ini tidak bisa dibatalkan.');
  if (!ok) return;
  localHistory.length = 0;
  saveHistoryToStorage();
  selectedKeys.clear();
  selectMode = false;
  loadHistoryList();
  showToast('Semua riwayat dihapus ✓');
};

function loadHistoryList() {
  const listEl = document.getElementById('histList');
  const selectBtn = document.getElementById('selectModeBtn');

  selectBtn.textContent = selectMode
    ? (selectedKeys.size > 0 ? `Hapus (${selectedKeys.size})` : 'Batal')
    : 'Select';
  selectBtn.className = selectMode ? (selectedKeys.size > 0 ? 'danger' : 'active') : '';

  if (localHistory.length === 0) {
    listEl.innerHTML = '<div class="empty-hist">Belum ada riwayat tersimpan.</div>';
    return;
  }

  const items = [...localHistory].sort((a, b) => (b.savedAt || '').localeCompare(a.savedAt || ''));

  listEl.innerHTML = '';
  items.forEach(item => {
    let totalKg = 0;
    CATEGORIES.forEach(cat => {
      if (cat.unit !== 'kg') return;
      const vals = (item.state[cat.code] || []).map(parseNum).filter(v => !isNaN(v));
      totalKg += vals.reduce((a,b) => a+b, 0);
    });
    const div = document.createElement('div');
    div.className = 'hist-item';
    const custLabel = item.customer ? (' · ' + item.customer) : '';
    let timeLabel = '';
    if (item.savedAt) {
      try {
        const d = new Date(item.savedAt);
        timeLabel = ' · disimpan ' + d.toLocaleDateString('id-ID') + ' ' + d.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
      } catch (e) {}
    }

    const isChecked = selectedKeys.has(item.key);

    div.innerHTML = `
      <div style="display:flex;align-items:center;flex:1;min-width:0;">
        ${selectMode ? `<div class="hist-checkbox ${isChecked ? 'checked' : ''}">${isChecked ? '✓' : ''}</div>` : ''}
        <div style="min-width:0;">
          <div class="d">${item.date}${custLabel}</div>
          <div class="t">${totalKg.toFixed(2)} kg total${timeLabel}</div>
        </div>
      </div>
      ${selectMode ? '' : '<button class="open-btn">Buka</button>'}
    `;

    if (selectMode) {
      div.onclick = () => {
        if (selectedKeys.has(item.key)) selectedKeys.delete(item.key);
        else selectedKeys.add(item.key);
        loadHistoryList();
      };
    } else {
      div.querySelector('.open-btn').onclick = () => {
        CATEGORIES.forEach(cat => {
          state[cat.code] = (item.state[cat.code] && item.state[cat.code].length) ? item.state[cat.code] : [''];
        });
        selectedCustomer = item.customer || null;
        document.getElementById('dateInput').value = item.date;
        document.getElementById('histOverlay').classList.remove('open');
        render();
        renderCustomers();
        showToast('Dimuat ✓');
      };
    }

    listEl.appendChild(div);
  });
}

// ---- FINISH: build WhatsApp-friendly plain text summary ----
function buildSummaryText() {
  const dateStr = document.getElementById('dateInput').value.trim() || '-';
  const lines = [];
  lines.push('Customer: ' + (selectedCustomer || '-'));
  lines.push('Tanggal: ' + dateStr);
  lines.push('');

  let totalKg = 0;
  CATEGORIES.forEach(cat => {
    const values = state[cat.code].map(parseNum).filter(v => !isNaN(v));
    if (values.length === 0) return;
    const sum = values.reduce((a,b) => a+b, 0);
    if (cat.unit === 'kg') totalKg += sum;
    const breakdown = values.map(v => v.toFixed(2)).join('+');
    lines.push(cat.code + ' (' + breakdown + ') = ' + sum.toFixed(2) + ' ' + cat.unit);
  });

  lines.push('');
  lines.push('TOTAL: ' + totalKg.toFixed(2) + ' kg');

  const boneSum = catSum('Bone');
  if (boneSum > 0) {
    lines.push('Bone (terpisah): ' + boneSum.toFixed(2) + ' g');
  }

  return lines.join('\n');
}

document.getElementById('finishBtn').onclick = () => {
  const text = buildSummaryText();
  document.getElementById('summaryBox').textContent = text;
  document.getElementById('finishOverlay').classList.add('open');
};
document.getElementById('closeFinish').onclick = () => {
  document.getElementById('finishOverlay').classList.remove('open');
};
document.getElementById('closeFinish2').onclick = () => {
  document.getElementById('finishOverlay').classList.remove('open');
};
document.getElementById('finishOverlay').onclick = (e) => {
  if (e.target.id === 'finishOverlay') e.currentTarget.classList.remove('open');
};

document.getElementById('copyBtn').onclick = async () => {
  const text = document.getElementById('summaryBox').textContent;
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      await navigator.clipboard.writeText(text);
    } else {
      throw new Error('no clipboard api');
    }
    showToast('Tersalin ✓ Tinggal paste ke WA');
  } catch (err) {
    // Fallback for webviews without navigator.clipboard support
    try {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      showToast('Tersalin ✓ Tinggal paste ke WA');
    } catch (err2) {
      await customAlert('Gagal copy otomatis. Tap dan tahan teks di atas, lalu pilih Copy.');
    }
  }
};

render();
renderCustomers();
</script>
