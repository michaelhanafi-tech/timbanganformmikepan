<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Form Timbangan</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0f1115;
    color: #e8e8e8;
    padding-bottom: 100px;
  }
  header {
    padding: 20px 16px 14px;
    background: #16181f;
    border-bottom: 1px solid #262a35;
    position: sticky;
    top: 0;
    z-index: 10;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  header h1 {
    margin: 0;
    font-size: 19px;
    letter-spacing: 0.3px;
  }
  .hist-btn {
    background: #1c1f28;
    border: 1px solid #2c3040;
    color: #7dd3fc;
    padding: 8px 12px;
    border-radius: 10px;
    font-size: 13px;
  }
  .topbar {
    padding: 12px 16px 0;
  }
  .datebar {
    display: flex;
    gap: 8px;
    margin-bottom: 10px;
  }
  .datebar input {
    flex: 1;
    background: #1c1f28;
    border: 1px solid #2c3040;
    color: #e8e8e8;
    padding: 10px 12px;
    border-radius: 10px;
    font-size: 14px;
  }
  .cust-label {
    font-size: 12px;
    color: #8b8f9c;
    margin-bottom: 6px;
  }
  .cust-row {
    display: flex;
    gap: 8px;
    margin-bottom: 6px;
  }
  .cust-btn {
    flex: 1;
    padding: 12px 8px;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 700;
    border: 1px solid #2c3040;
    background: #1c1f28;
    color: #9ca3af;
  }
  .cust-btn.active-BESAR { background: #22c55e; color: #0f1115; border-color: #22c55e; }
  .cust-btn.active-HIJAU { background: #4ade80; color: #0f1115; border-color: #4ade80; }
  .cust-btn.active-MERAH { background: #f87171; color: #0f1115; border-color: #f87171; }
  .container {
    padding: 16px;
  }
  .cat {
    background: #171a22;
    border: 1px solid #262a35;
    border-radius: 14px;
    margin-bottom: 12px;
    overflow: hidden;
  }
  .cat-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 16px;
    cursor: pointer;
  }
  .cat-head .left {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .badge {
    width: 42px;
    height: 42px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 13px;
    color: #0f1115;
  }
  .cat-total { font-size: 15px; font-weight: 700; color: #4ade80; }
  .cat-name {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 15px;
    font-weight: 600;
  }
  .utuh-tag {
    font-size: 10px;
    font-weight: 700;
    background: #1c2430;
    color: #7dd3fc;
    padding: 3px 7px;
    border-radius: 6px;
    letter-spacing: 0.4px;
  }
  .cat-body {
    display: none;
    padding: 0 16px 16px;
  }
  .cat-body.open { display: block; }
  .entry-row {
    display: flex;
    gap: 8px;
    margin-bottom: 8px;
  }
  .entry-row input {
    flex: 1;
    background: #0f1115;
    border: 1px solid #2c3040;
    color: #e8e8e8;
    padding: 10px 12px;
    border-radius: 10px;
    font-size: 16px;
  }
  .entry-row button {
    background: #291b1e;
    border: 1px solid #4a2830;
    color: #f87171;
    border-radius: 10px;
    width: 42px;
    font-size: 16px;
  }
  .add-btn {
    width: 100%;
    padding: 10px;
    background: #1c2430;
    border: 1px dashed #35415a;
    color: #7dd3fc;
    border-radius: 10px;
    font-size: 14px;
    margin-top: 4px;
  }
  .grand {
    background: #171a22;
    border: 1px solid #262a35;
    border-radius: 14px;
    padding: 16px;
    margin-top: 8px;
  }
  .grand h3 {
    margin: 0 0 10px;
    font-size: 14px;
    color: #8b8f9c;
    font-weight: 600;
  }
  .grand-row {
    display: flex;
    justify-content: space-between;
    font-size: 14px;
    padding: 5px 0;
    border-bottom: 1px solid #1f232d;
  }
  .grand-row.total {
    border-bottom: none;
    margin-top: 6px;
    padding-top: 10px;
    border-top: 1px solid #2c3040;
    font-size: 17px;
    font-weight: 700;
  }
  .grand-row.total span:last-child { color: #4ade80; }
  .footer-bar {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: #16181f;
    border-top: 1px solid #262a35;
    padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
    display: flex;
    gap: 10px;
  }
  .footer-bar button {
    flex: 1;
    padding: 14px;
    border-radius: 12px;
    font-size: 15px;
    font-weight: 700;
    border: none;
  }
  .btn-save { background: #1c1f28; color: #7dd3fc; border: 1px solid #2c3040; flex: 0 0 90px; }
  .btn-finish { background: #22c55e; color: #0f1115; }
  .btn-reset { background: #1c1f28; color: #9ca3af; border: 1px solid #2c3040; flex: 0 0 74px; }
  .chev { transition: transform 0.2s; color: #6b7280; }
  .chev.open { transform: rotate(180deg); }

  .overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    z-index: 50;
    align-items: flex-end;
  }
  .overlay.open { display: flex; }
  .sheet {
    background: #16181f;
    width: 100%;
    max-height: 85vh;
    border-radius: 20px 20px 0 0;
    padding: 16px;
    overflow-y: auto;
  }
  .sheet-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
  }
  .sheet-head h3 { margin: 0; font-size: 16px; }
  .close-btn {
    background: #1c1f28;
    border: 1px solid #2c3040;
    color: #9ca3af;
    width: 32px; height: 32px;
    border-radius: 8px;
    font-size: 14px;
  }
  .hist-item {
    background: #1c1f28;
    border: 1px solid #262a35;
    border-radius: 12px;
    padding: 12px 14px;
    margin-bottom: 8px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .hist-item .d { font-size: 14px; font-weight: 600; }
  .hist-item .t { font-size: 12px; color: #8b8f9c; margin-top: 2px; }
  .hist-item button {
    background: #22c55e;
    color: #0f1115;
    border: none;
    padding: 8px 14px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 700;
  }
  .empty-hist { color: #6b7280; font-size: 13px; text-align: center; padding: 24px 0; }
  .toast {
    position: fixed;
    bottom: 90px;
    left: 50%;
    transform: translateX(-50%);
    background: #22c55e;
    color: #0f1115;
    padding: 10px 18px;
    border-radius: 10px;
    font-size: 13px;
    font-weight: 700;
    opacity: 0;
    transition: opacity 0.25s;
    z-index: 60;
    pointer-events: none;
  }
  .toast.show { opacity: 1; }

  .summary-box {
    background: #0f1115;
    border: 1px solid #262a35;
    border-radius: 12px;
    padding: 14px;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 13.5px;
    line-height: 1.7;
    white-space: pre-wrap;
    word-break: break-word;
    color: #e8e8e8;
    margin-bottom: 14px;
  }
  .sheet-actions {
    display: flex;
    gap: 10px;
  }
  .sheet-actions button {
    flex: 1;
    padding: 14px;
    border-radius: 12px;
    font-size: 15px;
    font-weight: 700;
    border: none;
  }
  .btn-copy { background: #22c55e; color: #0f1115; }
  .btn-close2 { background: #1c1f28; color: #9ca3af; border: 1px solid #2c3040; }
</style>
</head>
<body>

<header>
  <h1>🥩 Form Timbangan</h1>
  <button class="hist-btn" id="histBtn">Riwayat</button>
</header>

<div class="topbar">
  <div class="datebar">
    <input type="text" id="dateInput" placeholder="Tanggal (contoh: Kamis, 6 Agu 2026)">
  </div>
  <div class="cust-label">Customer</div>
  <div class="cust-row" id="custRow"></div>
</div>

<div class="container" id="catContainer"></div>

<div class="footer-bar">
  <button class="btn-reset" id="resetBtn">Reset</button>
  <button class="btn-save" id="saveBtn">Simpan</button>
  <button class="btn-finish" id="finishBtn">FINISH</button>
</div>

<div class="overlay" id="histOverlay">
  <div class="sheet">
    <div class="sheet-head">
      <h3>Riwayat Tersimpan</h3>
      <button class="close-btn" id="closeHist">✕</button>
    </div>
    <div id="histList"><div class="empty-hist">Memuat...</div></div>
  </div>
</div>

<div class="overlay" id="finishOverlay">
  <div class="sheet">
    <div class="sheet-head">
      <h3>Ringkasan</h3>
      <button class="close-btn" id="closeFinish">✕</button>
    </div>
    <div class="summary-box" id="summaryBox"></div>
    <div class="sheet-actions">
      <button class="btn-close2" id="closeFinish2">Tutup</button>
      <button class="btn-copy" id="copyBtn">COPY</button>
    </div>
  </div>
</div>

<div class="overlay" id="modalOverlay">
  <div class="sheet" style="max-height:none;">
    <div id="modalMsg" style="font-size:15px;line-height:1.5;margin-bottom:18px;"></div>
    <div class="sheet-actions" id="modalActions"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const CATEGORIES = [
  { code: 'R',        color: '#f87171', unit: 'kg' },
  { code: 'R (UTUH)', color: '#fca5a5', unit: 'kg' },
  { code: 'O',        color: '#fb923c', unit: 'kg' },
  { code: 'O (UTUH)', color: '#fdba74', unit: 'kg' },
  { code: 'B',        color: '#facc15', unit: 'kg' },
  { code: 'K',        color: '#a3e635', unit: 'kg' },
  { code: 'US',       color: '#4ade80', unit: 'kg' },
  { code: 'US (UTUH)', color: '#86efac', unit: 'kg' },
  { code: 'SIR',      color: '#2dd4bf', unit: 'kg' },
  { code: 'SIR (UTUH)', color: '#5eead4', unit: 'kg' },
  { code: 'L',        color: '#60a5fa', unit: 'kg' },
  { code: 'Tongue',   color: '#818cf8', unit: 'kg' },
  { code: 'GFPrime',  color: '#c084fc', unit: 'kg' },
  { code: 'GFPrem',   color: '#e879f9', unit: 'kg' },
  { code: 'Bone Marrow', color: '#fbbf24', unit: 'kg' },
  { code: 'Bone',     color: '#fca5a5', unit: 'g' },
  { code: 'LOAF (UTUH)', color: '#38bdf8', unit: 'kg' },
];

const CUSTOMERS = ['BESAR', 'HIJAU', 'MERAH'];

const state = {};
CATEGORIES.forEach(c => state[c.code] = ['']);
let selectedCustomer = null;
const openState = {};

// In-memory history for this session. There is no reliable device-level
// storage available in this environment, so data lives only in the
// browser tab's memory while the page stays open.
const localHistory = [];

const container = document.getElementById('catContainer');
const toastEl = document.getElementById('toast');

function parseNum(v) {
  if (typeof v !== 'string') return NaN;
  const cleaned = v.replace(',', '.').trim();
  return parseFloat(cleaned);
}

function catSum(code) {
  return state[code].map(parseNum).filter(v => !isNaN(v)).reduce((a,b) => a+b, 0);
}

function cssId(code) {
  return code.replace(/[^a-zA-Z0-9]+/g, '_');
}

function baseCode(code) {
  return code.replace(/\s*\(UTUH\)$/i, '');
}

function isUtuh(code) {
  return /\(UTUH\)$/i.test(code);
}

// ---- Customer selector ----
function renderCustomers() {
  const row = document.getElementById('custRow');
  row.innerHTML = '';
  CUSTOMERS.forEach(name => {
    const btn = document.createElement('button');
    btn.className = 'cust-btn' + (selectedCustomer === name ? ' active-' + name : '');
    btn.type = 'button';
    btn.textContent = name;
    btn.onclick = () => {
      selectedCustomer = (selectedCustomer === name) ? null : name;
      renderCustomers();
    };
    row.appendChild(btn);
  });
}

// Full render: rebuilds structure (rows added/removed, toggle open/close)
function render() {
  container.innerHTML = '';
  CATEGORIES.forEach(cat => {
    const sum = catSum(cat.code);

    const catDiv = document.createElement('div');
    catDiv.className = 'cat';

    const head = document.createElement('div');
    head.className = 'cat-head';
    head.innerHTML = `
      <div class="left">
        <div class="badge" style="background:${cat.color}">${baseCode(cat.code)}</div>
        <div class="cat-name">${baseCode(cat.code)}${isUtuh(cat.code) ? '<span class="utuh-tag">UTUH</span>' : ''}</div>
      </div>
      <div style="display:flex;align-items:center;gap:10px;">
        <div class="cat-total" id="total-${cssId(cat.code)}">${sum > 0 ? sum.toFixed(2) + ' ' + cat.unit : '—'}</div>
        <div class="chev ${openState[cat.code] ? 'open' : ''}">▾</div>
      </div>
    `;
    head.onclick = () => { openState[cat.code] = !openState[cat.code]; render(); };

    const body = document.createElement('div');
    body.className = 'cat-body' + (openState[cat.code] ? ' open' : '');

    state[cat.code].forEach((val, idx) => {
      const row = document.createElement('div');
      row.className = 'entry-row';
      const input = document.createElement('input');
      input.type = 'text';
      input.inputMode = 'decimal';
      input.placeholder = 'Berat ' + cat.unit;
      input.value = val;
      // Lightweight update: only touch state + totals, never re-render the whole DOM
      input.oninput = (e) => {
        state[cat.code][idx] = e.target.value;
        refreshTotalsOnly();
      };
      const delBtn = document.createElement('button');
      delBtn.type = 'button';
      delBtn.textContent = '✕';
      delBtn.onclick = () => {
        state[cat.code].splice(idx, 1);
        if (state[cat.code].length === 0) state[cat.code].push('');
        render();
      };
      row.appendChild(input);
      row.appendChild(delBtn);
      body.appendChild(row);
    });

    const addBtn = document.createElement('button');
    addBtn.className = 'add-btn';
    addBtn.type = 'button';
    addBtn.textContent = '+ Tambah angka';
    addBtn.onclick = () => {
      state[cat.code].push('');
      openState[cat.code] = true;
      render();
      const inputs = document.querySelectorAll(`#body-${cssId(cat.code)} input`);
      if (inputs.length) inputs[inputs.length - 1].focus();
    };
    body.id = 'body-' + cssId(cat.code);
    body.appendChild(addBtn);

    catDiv.appendChild(head);
    catDiv.appendChild(body);
    container.appendChild(catDiv);
  });

  renderGrandTotal();
}

// Lightweight update: does NOT touch input elements, so focus/cursor is preserved
function refreshTotalsOnly() {
  CATEGORIES.forEach(cat => {
    const sum = catSum(cat.code);
    const el = document.getElementById('total-' + cssId(cat.code));
    if (el) el.textContent = sum > 0 ? sum.toFixed(2) + ' ' + cat.unit : '—';
  });
  renderGrandTotal();
}

function renderGrandTotal() {
  let old = document.getElementById('grandBox');
  if (old) old.remove();

  const grand = document.createElement('div');
  grand.className = 'grand';
  grand.id = 'grandBox';
  grand.innerHTML = `<h3>TOTAL KESELURUHAN</h3>`;

  let totalKg = 0;
  CATEGORIES.forEach(cat => {
    if (cat.unit !== 'kg') return;
    const sum = catSum(cat.code);
    if (sum > 0) {
      totalKg += sum;
      const row = document.createElement('div');
      row.className = 'grand-row';
      row.innerHTML = `<span>${cat.code}</span><span>${sum.toFixed(2)} kg</span>`;
      grand.appendChild(row);
    }
  });

  const totalRow = document.createElement('div');
  totalRow.className = 'grand-row total';
  totalRow.innerHTML = `<span>Total (kg)</span><span>${totalKg.toFixed(2)} kg</span>`;
  grand.appendChild(totalRow);

  const boneSum = catSum('Bone');
  if (boneSum > 0) {
    const boneRow = document.createElement('div');
    boneRow.className = 'grand-row';
    boneRow.innerHTML = `<span>Bone (terpisah)</span><span>${boneSum.toFixed(2)} g</span>`;
    grand.appendChild(boneRow);
  }

  container.appendChild(grand);
}

document.getElementById('resetBtn').onclick = async () => {
  const ok = await customConfirm('Reset semua data?');
  if (!ok) return;
  CATEGORIES.forEach(c => state[c.code] = ['']);
  Object.keys(openState).forEach(k => openState[k] = false);
  selectedCustomer = null;
  render();
  renderCustomers();
};

function showToast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  setTimeout(() => toastEl.classList.remove('show'), 1600);
}

// Self-contained modal replacements for alert()/confirm(). Native browser
// dialogs can be silently blocked inside sandboxed iframes (which this
// artifact runs in), so we never rely on them for anything the flow depends on.
function customAlert(message) {
  return new Promise(resolve => {
    const overlay = document.getElementById('modalOverlay');
    document.getElementById('modalMsg').textContent = message;
    const actions = document.getElementById('modalActions');
    actions.innerHTML = '';
    const okBtn = document.createElement('button');
    okBtn.className = 'btn-copy';
    okBtn.textContent = 'OK';
    okBtn.onclick = () => {
      overlay.classList.remove('open');
      resolve();
    };
    actions.appendChild(okBtn);
    overlay.classList.add('open');
  });
}

function customConfirm(message) {
  return new Promise(resolve => {
    const overlay = document.getElementById('modalOverlay');
    document.getElementById('modalMsg').textContent = message;
    const actions = document.getElementById('modalActions');
    actions.innerHTML = '';
    const cancelBtn = document.createElement('button');
    cancelBtn.className = 'btn-close2';
    cancelBtn.textContent = 'Batal';
    cancelBtn.onclick = () => { overlay.classList.remove('open'); resolve(false); };
    const okBtn = document.createElement('button');
    okBtn.className = 'btn-copy';
    okBtn.textContent = 'Ya';
    okBtn.onclick = () => { overlay.classList.remove('open'); resolve(true); };
    actions.appendChild(cancelBtn);
    actions.appendChild(okBtn);
    overlay.classList.add('open');
  });
}

// ---- Save / History ----
// SIMPAN stores the current entry in this session's memory (so it can be
// resumed later via Riwayat), then clears the form for a new sale.
// NOTE: this is in-browser memory only — it does NOT persist if the page
// is closed/refreshed. There is no reliable device-level storage available
// in this environment, so we keep it simple and dependency-free.
document.getElementById('saveBtn').onclick = async () => {
  const dateStr = document.getElementById('dateInput').value.trim();
  if (!dateStr) { await customAlert('Isi tanggal dulu sebelum simpan.'); return; }

  const hasData = CATEGORIES.some(cat => catSum(cat.code) > 0);
  if (!hasData) { await customAlert('Belum ada berat yang diisi.'); return; }

  const key = 'timbangan-' + Date.now();
  const payload = { key, date: dateStr, customer: selectedCustomer, state: JSON.parse(JSON.stringify(state)), savedAt: new Date().toISOString() };
  localHistory.unshift(payload);

  // Clear the form for a new sale — the saved entry stays accessible under Riwayat
  CATEGORIES.forEach(c => state[c.code] = ['']);
  Object.keys(openState).forEach(k => openState[k] = false);
  selectedCustomer = null;
  document.getElementById('dateInput').value = '';
  render();
  renderCustomers();
  showToast('Tersimpan ✓ — form dikosongkan, siap transaksi baru');
};

document.getElementById('histBtn').onclick = () => {
  document.getElementById('histOverlay').classList.add('open');
  loadHistoryList();
};
document.getElementById('closeHist').onclick = () => {
  document.getElementById('histOverlay').classList.remove('open');
};
document.getElementById('histOverlay').onclick = (e) => {
  if (e.target.id === 'histOverlay') e.currentTarget.classList.remove('open');
};

function loadHistoryList() {
  const listEl = document.getElementById('histList');

  if (localHistory.length === 0) {
    listEl.innerHTML = '<div class="empty-hist">Belum ada riwayat tersimpan di sesi ini.</div>';
    return;
  }

  const items = [...localHistory].sort((a, b) => (b.savedAt || '').localeCompare(a.savedAt || ''));

  listEl.innerHTML = '';
  items.forEach(item => {
      let totalKg = 0;
      CATEGORIES.forEach(cat => {
        if (cat.unit !== 'kg') return;
        const vals = (item.state[cat.code] || []).map(parseNum).filter(v => !isNaN(v));
        totalKg += vals.reduce((a,b) => a+b, 0);
      });
      const div = document.createElement('div');
      div.className = 'hist-item';
      const custLabel = item.customer ? (' · ' + item.customer) : '';
      let timeLabel = '';
      if (item.savedAt) {
        try {
          const d = new Date(item.savedAt);
          timeLabel = ' · disimpan ' + d.toLocaleDateString('id-ID') + ' ' + d.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
        } catch (e) {}
      }
      div.innerHTML = `
        <div>
          <div class="d">${item.date}${custLabel}</div>
          <div class="t">${totalKg.toFixed(2)} kg total${timeLabel}</div>
        </div>
        <div style="display:flex;gap:6px;">
          <button data-act="open">Buka</button>
          <button data-act="del" style="background:#291b1e;color:#f87171;">✕</button>
        </div>
      `;
      div.querySelector('[data-act="open"]').onclick = () => {
        CATEGORIES.forEach(cat => {
          state[cat.code] = (item.state[cat.code] && item.state[cat.code].length) ? item.state[cat.code] : [''];
        });
        selectedCustomer = item.customer || null;
        document.getElementById('dateInput').value = item.date;
        document.getElementById('histOverlay').classList.remove('open');
        render();
        renderCustomers();
        showToast('Dimuat ✓');
      };
      div.querySelector('[data-act="del"]').onclick = async () => {
        const ok = await customConfirm('Hapus riwayat ini?');
        if (!ok) return;
        const idx = localHistory.findIndex(h => h.key === item.key);
        if (idx !== -1) localHistory.splice(idx, 1);
        loadHistoryList();
      };
      listEl.appendChild(div);
  });
}

// ---- FINISH: build WhatsApp-friendly plain text summary ----
function buildSummaryText() {
  const dateStr = document.getElementById('dateInput').value.trim() || '-';
  const lines = [];
  lines.push('Customer: ' + (selectedCustomer || '-'));
  lines.push('Tanggal: ' + dateStr);
  lines.push('');

  let totalKg = 0;
  CATEGORIES.forEach(cat => {
    const values = state[cat.code].map(parseNum).filter(v => !isNaN(v));
    if (values.length === 0) return;
    const sum = values.reduce((a,b) => a+b, 0);
    if (cat.unit === 'kg') totalKg += sum;
    const breakdown = values.map(v => v.toFixed(2)).join('+');
    lines.push(cat.code + ' (' + breakdown + ') = ' + sum.toFixed(2) + ' ' + cat.unit);
  });

  lines.push('');
  lines.push('TOTAL: ' + totalKg.toFixed(2) + ' kg');

  const boneSum = catSum('Bone');
  if (boneSum > 0) {
    lines.push('Bone (terpisah): ' + boneSum.toFixed(2) + ' g');
  }

  return lines.join('\n');
}

document.getElementById('finishBtn').onclick = () => {
  const text = buildSummaryText();
  document.getElementById('summaryBox').textContent = text;
  document.getElementById('finishOverlay').classList.add('open');
};
document.getElementById('closeFinish').onclick = () => {
  document.getElementById('finishOverlay').classList.remove('open');
};
document.getElementById('closeFinish2').onclick = () => {
  document.getElementById('finishOverlay').classList.remove('open');
};
document.getElementById('finishOverlay').onclick = (e) => {
  if (e.target.id === 'finishOverlay') e.currentTarget.classList.remove('open');
};

document.getElementById('copyBtn').onclick = async () => {
  const text = document.getElementById('summaryBox').textContent;
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      await navigator.clipboard.writeText(text);
    } else {
      throw new Error('no clipboard api');
    }
    showToast('Tersalin ✓ Tinggal paste ke WA');
  } catch (err) {
    // Fallback for webviews without navigator.clipboard support
    try {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      showToast('Tersalin ✓ Tinggal paste ke WA');
    } catch (err2) {
      await customAlert('Gagal copy otomatis. Tap dan tahan teks di atas, lalu pilih Copy.');
    }
  }
};

render();
renderCustomers();
</script>
